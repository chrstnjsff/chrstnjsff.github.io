<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/_fonts.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    position:relative;background:#fff;color:#070707;
    font-family:"Geist Variable",ui-sans-serif,system-ui,sans-serif;
    display:flex;align-items:center;gap:64px;padding:0 80px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:absolute;inset:0 0 0 40%;background-image:radial-gradient(rgba(10,10,10,.13) 1px,transparent 1.2px);background-size:12px 12px;-webkit-mask-image:radial-gradient(70% 80% at 70% 20%,#000,transparent 75%)}
  .photo{position:relative;width:336px;height:420px;flex-shrink:0;border-radius:26px;border:1px solid #e5e5e5;object-fit:cover;box-shadow:0 28px 56px -24px rgba(10,10,10,.4)}
  .copy{position:relative}
  .logo{display:flex;align-items:center;gap:10px;font:700 24px/1 "Space Grotesk Variable",sans-serif;letter-spacing:-.03em}
  .logo .w span{color:#737373;font-weight:500}
  .kicker{margin-top:44px;font:400 15px/1 "Geist Mono Variable",monospace;letter-spacing:.1em;text-transform:uppercase;color:#525252}
  h1{margin-top:16px;font:700 68px/1 "Space Grotesk Variable",sans-serif;letter-spacing:-1.7px}
  .lede{margin-top:22px;max-width:620px;font-size:23px;line-height:34px;color:#262626}
  .stats{margin-top:34px;display:flex;gap:44px}
  .stats b{display:block;font:600 30px/1 "Space Grotesk Variable",sans-serif;letter-spacing:-.5px}
  .stats span{display:block;margin-top:10px;font:400 13px/1 "Geist Mono Variable",monospace;letter-spacing:.1em;text-transform:uppercase;color:#525252}
</style>
</head>
<body>
  <img class="photo" src="/avatar.webp" alt="">
  <div class="copy">
    <p class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.95" y="5" width="18.3" height="14.2" rx="3"/><path d="m6.8 10.2 3.1 2.5-3.1 2.5M12.1 15.2h5.3"/></svg><span class="w"><span>~/</span>home</span></p>
    <p class="kicker">Senior DevOps engineer · Mandaluyong, PH</p>
    <h1>Christian Josef Aquino</h1>
    <p class="lede">I keep production running: 148 Kubernetes clusters across AWS, Azure and GCP.</p>
    <div class="stats">
      <div><b>7+</b><span>years</span></div>
      <div><b>148</b><span>clusters</span></div>
      <div><b>99.95%</b><span>uptime</span></div>
    </div>
  </div>
</body>
</html>
